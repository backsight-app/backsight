# cargo-about settings for THIRD-PARTY-NOTICES.txt (scripts/third-party-notices.ps1).
# Only the crates compiled into the shipped backsight.exe count: build scripts, proc macros'
# hosts and tests don't ship.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Every license here is compatible with GPL-3.0-or-later.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "GPL-3.0-or-later",
]

# Its one LICENSE file is the BSD text; cargo-about would otherwise print a blank MIT template.
[brotli-decompressor.clarify]
license = "BSD-3-Clause"
[[brotli-decompressor.clarify.files]]
path = "LICENSE"
license = "BSD-3-Clause"
checksum = "c0c56f26d9c051cac4d200c34c84e7ae9aaa853e01a982a1df08b09931e518ae"

# Apache-2.0 for the crate, MIT for the libm code it carries (see its README).
[dpi.clarify]
license = "Apache-2.0 AND MIT"
[[dpi.clarify.files]]
path = "LICENSE"
license = "Apache-2.0"
checksum = "6dc0e068dcf3a5bc8e054205b85b7720e1d49265bbc64bf515d2cf79197df69a"
[[dpi.clarify.files]]
path = "LICENSE-LIBM-MIT"
license = "MIT"
checksum = "9eff396a99bafd208e7126602420d6864f6066c08b84485a5b032320a9c01997"

# Its LICENSE holds the MIT text plus the notice for code taken from rust-crypto, so cargo-about
# can't recognise it on its own.
[minisign-verify.clarify]
license = "MIT"
[[minisign-verify.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "42c8695fbc468866d9756be99af0ba4e37d733f8daa3c8827c8d80b8bec1b2f9"
