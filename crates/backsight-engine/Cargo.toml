[package]
name = "backsight-engine"
description = "Backsight engine: screen and audio capture, the replay buffer, recording, screenshots and hotkeys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
backsight-config.workspace = true
toml.workspace = true
backsight-encode.workspace = true
serde.workspace = true
serde_json.workspace = true
dunce = "1"
half = "2.7"
tracing.workspace = true
tracing-subscriber.workspace = true
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Metadata",
    "Win32_Devices_FunctionDiscovery",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Performance",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[implement]` (the process-loopback completion handler) expands to `::windows_core` paths.
windows-core = "0.62"

[dev-dependencies]
backsight-config.workspace = true
criterion = "0.8"
tempfile = "3"

[[bench]]
name = "hot_paths"
harness = false

[lints]
workspace = true
