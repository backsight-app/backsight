<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Backsight</title>
  <defs>
    <linearGradient id="bs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="bs-gloss" cx="0.28" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bs-dot" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FF9BAE"/>
      <stop offset="1" stop-color="#FF3D63"/>
    </radialGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#bs-bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#bs-gloss)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="214.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>
  <!-- Replay ring: runs clockwise from 12 o'clock round to 8 o'clock; the arrow points back (rewind). -->
  <path d="M512 262 A250 250 0 1 1 277.1 426.5" fill="none" stroke="#FFFFFF" stroke-width="76" stroke-linecap="round"/>
  <path d="M378 262 L536 164 L536 360 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="30" stroke-linejoin="round"/>
  <!-- Record dot -->
  <circle cx="512" cy="512" r="106" fill="url(#bs-dot)"/>
  <circle cx="512" cy="512" r="106" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="6"/>
</svg>
