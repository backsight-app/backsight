name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Read before you post.** A problem report or log lists the programs that were running and your settings. Read it first, and paste only what you are happy for everyone to see. Security problems: please don't post them here; see [SECURITY.md](https://github.com/backsight-app/backsight/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 (26100)
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      placeholder: RTX 4060, driver 581.xx
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Encoder and file format
      placeholder: NVENC HEVC, Crash-safe MP4
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste `%APPDATA%\Backsight\logs\backsight.log` if it exists. Read it first and remove anything you don't want public.
      render: text
